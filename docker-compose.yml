services:
  postgres:
    image: timescale/timescaledb-ha:pg18
    # Preload pg_cron extension
    # https://github.com/timescale/timescaledb-docker-ha/issues/293
    command:
      - -cshared_preload_libraries=timescaledb,pg_cron
      - -ccron.database_name=postgres
      - -clogging_collector=on
      - -clog_directory=/home/postgres/logs
      - -clog_statement=all
      - -clog_lock_waits=on
      - -cdeadlock_timeout=1s
      - -clog_min_duration_statement=0
      - -clog_line_prefix='%m [%p] %q%u@%d '
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - '5432:5432'
    volumes:
      # - ./pgdata:/home/postgres/pgdata
      - ./db/imports:/home/postgres/imports
      - ./postgres-logs:/home/postgres/logs

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - '8025:8025'
      - '1025:1025'

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin123
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ADDRESS: ':9000'
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Admin UI
    volumes:
      - ./rustfs-data:/data
    command: ['/data']
